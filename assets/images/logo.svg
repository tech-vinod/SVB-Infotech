<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A896" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded Pill Badge -->
  <rect x="4" y="8" width="70" height="44" rx="22" fill="url(#tealGrad)" filter="url(#shadow)" />
  <!-- Text inside badge -->
  <text x="39" y="37" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">SVB</text>
  <!-- Infotech text -->
  <text x="86" y="39" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#111827" letter-spacing="-0.5">Infotech</text>
  <!-- Small dot accent -->
  <circle cx="218" cy="24" r="3.5" fill="#00C49F" />
</svg>
